<script>
(function(){
"use strict";

// ============================================================
// 基本設定
// ============================================================
const canvas = document.getElementById('hcanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rr(x,y,w,h,r){
  if (w<2*r) r=w/2; if (h<2*r) r=h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

const BASE_REACTION_MS = 2200;
const MIN_REACTION_MS = 550;
const REACTION_DECREMENT = 40;
const ROUND_PAUSE_MS = 300;
const COMPOUND_UNLOCK_ROUND = 8;
const CORRECTION_UNLOCK_ROUND = 15;
const CORRECTION_DELAY_MS = 480;
const BPM_MIN = 120, BPM_MAX = 210, BPM_GROWTH_PER_ROUND = 2;
const MILESTONE_EVERY = 10;

function currentReactionMs(rounds){ return Math.max(MIN_REACTION_MS, BASE_REACTION_MS - rounds*REACTION_DECREMENT); }
function currentBpm(rounds){ return clamp(BPM_MIN + rounds*BPM_GROWTH_PER_ROUND, BPM_MIN, BPM_MAX); }
function beatDurationMs(rounds){ return 60000/currentBpm(rounds); }

// ============================================================
// 指示生成
// ============================================================
function makeSingleInstr(){
  const instr = { whiteTarget:null, redTarget:null, special:null };
  const color = pick(['white','red']);
  const target = pick(['up','down']);
  const useNegative = Math.random() < 0.4;
  const colorText = color==='white' ? '白' : '赤';
  const text = useNegative
    ? colorText + ' ' + (target==='up' ? '下げないで' : '上げないで')
    : colorText + (target==='up' ? ' 上げて' : ' 下げて');
  instr[color+'Target'] = target;
  instr.text = text;
  return instr;
}
function makeCompoundInstruction(){
  const targets = { white: pick(['up','down']), red: pick(['up','down']) };
  const parts = [];
  for(const color of ['white','red']){
    const target = targets[color];
    const useNegative = Math.random() < 0.4;
    const colorText = color==='white' ? '白' : '赤';
    parts.push(useNegative
      ? colorText + ' ' + (target==='up' ? '下げないで' : '上げないで')
      : colorText + (target==='up' ? ' 上げて' : ' 下げて'));
  }
  return { whiteTarget:targets.white, redTarget:targets.red, special:'compound', text: parts.join('　') };
}
function makeCorrectionInstruction(){
  const decoy = makeSingleInstr();
  let real = makeSingleInstr();
  let guard=0;
  while(real.text===decoy.text && guard<10){ real = makeSingleInstr(); guard++; }
  return {
    whiteTarget: real.whiteTarget, redTarget: real.redTarget, special:'correction',
    text: decoy.text, correctedText: 'やっぱり '+real.text
  };
}
function pickInstruction(roundsCleared){
  const canCompound = roundsCleared >= COMPOUND_UNLOCK_ROUND;
  const canCorrection = roundsCleared >= CORRECTION_UNLOCK_ROUND;
  const roll = Math.random();
  let cursor = 0;
  if(canCorrection){ cursor += 0.20; if(roll < cursor) return makeCorrectionInstruction(); }
  if(canCompound){ cursor += 0.25; if(roll < cursor) return makeCompoundInstruction(); }
  return makeSingleInstr();
}
function checkFlagTargets(instr, flagState){
  if(instr.whiteTarget && flagState.white!==instr.whiteTarget) return false;
  if(instr.redTarget && flagState.red!==instr.redTarget) return false;
  return true;
}

// ============================================================
// グローバル状態
// ============================================================
let state='TITLE'; // TITLE, PLAYING, GAMEOVER_PENDING, GAMEOVER
let roundsCleared=0, score=0, bestRounds=0;
let flagState={ white:'down', red:'down' };
let phase='countdown'; // countdown, pause
let roundTimer=0, pauseTimer=0;
let currentInstruction=null;
let correctionRevealed=true;
let missFlashTimer=0;
let beatAccumMs=0, lastBeatIndex=-1, metroPulse=0;
let milestoneFlashTimer=0, milestoneText='';

let bgParticles=[];
for(let i=0;i<26;i++){
  bgParticles.push({ x:Math.random()*W, y:Math.random()*H*0.6, vx:0.15+Math.random()*0.25, r:14+Math.random()*20, a:0.4+Math.random()*0.3 });
}

// ============================================================
// ラウンド制御
// ============================================================
function startRound(){
  currentInstruction = pickInstruction(roundsCleared);
  roundTimer=0;
  correctionRevealed = (currentInstruction.special!=='correction');
  phase='countdown';
}
function resolveRound(){
  const speedBonus = Math.floor((BASE_REACTION_MS-currentReactionMs(roundsCleared))/120);
  score += 10 + speedBonus + (currentInstruction.special==='compound'?5:0) + (currentInstruction.special==='correction'?8:0);
  roundsCleared++;
  if(roundsCleared%MILESTONE_EVERY===0){
    milestoneFlashTimer=900;
    milestoneText = roundsCleared+'連続!';
    playMilestoneJingle();
  }
  phase='pause';
  pauseTimer=ROUND_PAUSE_MS;
}
function triggerGameOver(){
  if(state!=='PLAYING') return;
  missFlashTimer=650;
  state='GAMEOVER_PENDING';
  stopAmbient();
  playMissSound();
  bestRounds = Math.max(bestRounds, roundsCleared);
}
function toggleFlag(color){
  if(state!=='PLAYING' || phase!=='countdown') return;
  flagState[color] = flagState[color]==='up' ? 'down' : 'up';
  playToggleSound();
}
function startGame(){
  resumeAudio();
  roundsCleared=0; score=0;
  flagState={white:'down', red:'down'};
  missFlashTimer=0; milestoneFlashTimer=0;
  beatAccumMs=0; lastBeatIndex=-1;
  state='PLAYING';
  startAmbient();
  startRound();
}

// ============================================================
// 更新
// ============================================================
function updateAtmosphere(dt){
  for(const p of bgParticles){ p.x+=p.vx*dt; if(p.x-p.r>W) p.x=-p.r; }
}
function updateBeatClock(dt, rounds){
  beatAccumMs += dt*16.6667;
  const dur = beatDurationMs(rounds);
  const idx = Math.floor(beatAccumMs/dur);
  if(idx!==lastBeatIndex){
    lastBeatIndex=idx;
    metroPulse=1;
  } else {
    metroPulse = Math.max(0, metroPulse-dt*0.09);
  }
}
function update(dt){
  if(state==='TITLE'){ updateAtmosphere(dt); return; }

  if(state==='GAMEOVER_PENDING'){
    missFlashTimer -= dt*16.6667;
    if(missFlashTimer<=0){ state='GAMEOVER'; playGameOverJingle(); }
    return;
  }
  if(state==='GAMEOVER'){ updateAtmosphere(dt); return; }

  // PLAYING
  updateBeatClock(dt, roundsCleared);
  if(milestoneFlashTimer>0) milestoneFlashTimer -= dt*16.6667;

  if(phase==='pause'){
    pauseTimer -= dt*16.6667;
    if(pauseTimer<=0) startRound();
    return;
  }

  if(phase==='countdown'){
    roundTimer += dt*16.6667;

    if(currentInstruction.special==='correction' && !correctionRevealed){
      if(roundTimer >= CORRECTION_DELAY_MS){
        correctionRevealed = true;
        roundTimer = 0;
      }
      return;
    }

    const reactionMs = currentReactionMs(roundsCleared);
    if(roundTimer >= reactionMs){
      const ok = checkFlagTargets(currentInstruction, flagState);
      if(ok) resolveRound();
      else triggerGameOver();
    }
  }
}

// ============================================================
// 描画
// ============================================================
function centerText(text,y,size,color){
  ctx.font=size+"px 'Press Start 2P', monospace";
  ctx.fillStyle=color; ctx.textAlign='center';
  const lines = String(text).split('\n');
  lines.forEach((ln,i)=> ctx.fillText(ln, W/2, y+i*(size+8)));
  ctx.textAlign='left';
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7ec8e3'); g.addColorStop(0.55,'#bfe3ef'); g.addColorStop(1,'#f4ecd8');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.75)';
  for(const p of bgParticles){
    ctx.beginPath();
    ctx.ellipse(p.x,p.y,p.r,p.r*0.5,0,0,Math.PI*2);
    ctx.ellipse(p.x+p.r*0.7,p.y+2,p.r*0.7,p.r*0.4,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle='#8a9a5b';
  ctx.fillRect(0,H-40,W,40);
}
function drawFlagPole(x, colorKey, poleLabel, flagColor){
  const baseY=H-40, topY=140;
  ctx.strokeStyle='#5a4632'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,baseY); ctx.lineTo(x,topY); ctx.stroke();
  ctx.fillStyle='#5a4632';
  ctx.beginPath(); ctx.arc(x,topY-6,7,0,Math.PI*2); ctx.fill();

  const isUp = flagState[colorKey]==='up';
  const targetY = isUp ? topY+18 : baseY-70;
  if(!drawFlagPole.yMap) drawFlagPole.yMap={};
  const key=colorKey;
  if(drawFlagPole.yMap[key]===undefined) drawFlagPole.yMap[key]=targetY;
  drawFlagPole.yMap[key] += (targetY-drawFlagPole.yMap[key])*0.2;
  const fy = drawFlagPole.yMap[key];

  ctx.fillStyle=flagColor;
  ctx.beginPath();
  ctx.moveTo(x+4, fy);
  ctx.lineTo(x+64, fy+16);
  ctx.lineTo(x+4, fy+34);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1.5; ctx.stroke();

  ctx.font="11px 'Press Start 2P', monospace";
  ctx.fillStyle='#2b2118'; ctx.textAlign='center';
  ctx.fillText(poleLabel, x, baseY+26);
  ctx.textAlign='left';
}
function drawMetronome(){
  const cx=W/2, cy=95;
  const r=16+metroPulse*10;
  ctx.fillStyle=`rgba(255,183,3,${0.25+metroPulse*0.5})`;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill();
}
function drawInstructionBanner(){
  if(!currentInstruction) return;
  const showText = (currentInstruction.special==='correction' && !correctionRevealed)
    ? currentInstruction.text
    : (currentInstruction.correctedText || currentInstruction.text);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  rr(W/2-260,150,520,74,10); ctx.fill();
  ctx.strokeStyle = (currentInstruction.special==='correction' && correctionRevealed) ? '#e63946' : '#ffb703';
  ctx.lineWidth=2;
  rr(W/2-260,150,520,74,10); ctx.stroke();
  centerText(showText, 180, 14, '#2b2118');

  const inRealWindow = !(currentInstruction.special==='correction' && !correctionRevealed);
  if(inRealWindow){
    const reactionMs = currentReactionMs(roundsCleared);
    const remain = clamp(1-(roundTimer/reactionMs),0,1);
    ctx.fillStyle='#e0d8c0'; ctx.fillRect(W/2-260, 230, 520, 8);
    ctx.fillStyle = remain<0.3 ? '#e63946' : '#ffb703';
    ctx.fillRect(W/2-260, 230, 520*remain, 8);
  }
}
function drawHUD(){
  ctx.font="10px 'Press Start 2P', monospace";
  ctx.fillStyle='rgba(255,255,255,0.75)'; rr(10,10,190,58,8); ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.fillText('ROUNDS '+roundsCleared, 22, 30);
  ctx.fillText('BEST '+bestRounds, 22, 48);
  ctx.fillStyle='rgba(255,255,255,0.75)'; rr(W-180,10,170,34,8); ctx.fill();
  ctx.fillStyle='#2b2118';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'), W-170, 32);
}
function drawMilestoneFlash(){
  if(milestoneFlashTimer<=0) return;
  ctx.globalAlpha = Math.min(1, milestoneFlashTimer/900);
  centerText(milestoneText, 110, 14, '#2a9d5c');
  ctx.globalAlpha=1;
}
function drawMissFlash(){
  if(missFlashTimer<=0) return;
  const a = Math.min(0.7, missFlashTimer/650*0.7);
  ctx.fillStyle=`rgba(230,57,70,${a})`;
  ctx.fillRect(0,0,W,H);
  centerText('ミス!', H/2, 26, '#fff');
}
function drawTitleScreen(){
  drawBackground();
  centerText('旗揚げ', H*0.3, 30, '#e63946');
  ctx.save();
  ctx.globalAlpha=0.6+0.4*Math.sin(performance.now()/300);
  centerText('press ENTER / SPACE / TAP', H*0.56, 12, '#2b2118');
  ctx.restore();
  centerText('指示通りに旗を上げ下げ。「〜ないで」はフェイント', H*0.68, 10, '#5a4632');
  centerText('だんだん加速。ミスは即ゲームオーバー、どこまで続く?', H*0.74, 9, '#5a4632');
  if(bestRounds>0) centerText('自己ベスト '+bestRounds+' 連続', H*0.82, 9, '#8a9a5b');
}
function drawGameOverScreen(){
  drawBackground();
  centerText('GAME OVER', H*0.28, 24, '#e63946');
  centerText('指示通りに旗を扱えなかった…', H*0.28+30, 11, '#5a4632');
  centerText(roundsCleared+' 連続　SCORE '+String(score).padStart(6,'0'), H*0.28+62, 12, '#2b2118');
  if(roundsCleared>=bestRounds && roundsCleared>0) centerText('自己ベスト更新!', H*0.28+86, 10, '#2a9d5c');
  ctx.save();
  ctx.globalAlpha=0.6+0.4*Math.sin(performance.now()/300);
  centerText('press ENTER / SPACE / TAP でもう一度', H*0.72, 10, '#2b2118');
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='TITLE'){ drawTitleScreen(); return; }
  if(state==='GAMEOVER'){ drawGameOverScreen(); return; }

  drawBackground();
  drawFlagPole(300,'white','白 (←/A)', '#fdfaf3');
  drawFlagPole(660,'red','赤 (→/D)', '#e63946');
  drawMetronome();
  if(state==='PLAYING' || state==='GAMEOVER_PENDING'){
    drawInstructionBanner();
  }
  drawHUD();
  drawMilestoneFlash();
  drawMissFlash();
}

// ============================================================
// オーディオエンジン
// ============================================================
let audioCtx=null, masterGain=null, musicGain=null, sfxGain=null, muted=false;
function ensureAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain(); masterGain.gain.value=muted?0:1;
  musicGain=audioCtx.createGain(); musicGain.gain.value=0.4;
  sfxGain=audioCtx.createGain(); sfxGain.gain.value=0.6;
  musicGain.connect(masterGain); sfxGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);
}
function resumeAudio(){ ensureAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }

const NOTE = {
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25
};
function playNoteAt(freq,time,dur,type,vol,dest){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,time);
  gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(vol,time+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,time+dur);
  osc.connect(gain); gain.connect(dest);
  osc.start(time); osc.stop(time+dur+0.05);
}
const BGM_BPM = 132;
const BGM_BASS  = ['C3',0,'C3',0,'G3',0,'G3',0,'A3',0,'A3',0,'F3',0,'F3',0];
const BGM_LEAD  = [0,'E4',0,'G4', 0,'D4',0,'G4', 0,'E4',0,'C5', 0,'C4',0,'A4'];
let bgmStep=0, bgmNextTime=0, bgmTimer=null, bgmPlaying=false;
function bgmStepSeconds(){ return 60.0/BGM_BPM/2; }
function scheduleBgmStep(step,time){
  const b=BGM_BASS[step];
  if(b) playNoteAt(NOTE[b], time, bgmStepSeconds()*1.7, 'triangle', 0.16, musicGain);
  const l=BGM_LEAD[step];
  if(l) playNoteAt(NOTE[l], time, bgmStepSeconds()*0.85, 'square', 0.10, musicGain);
}
function bgmTick(){
  while(bgmNextTime < audioCtx.currentTime+0.12){
    scheduleBgmStep(bgmStep, bgmNextTime);
    bgmNextTime += bgmStepSeconds();
    bgmStep=(bgmStep+1)%BGM_BASS.length;
  }
}
function startAmbient(){
  resumeAudio(); if(!audioCtx || bgmPlaying) return;
  bgmPlaying=true; bgmStep=0; bgmNextTime=audioCtx.currentTime+0.05;
  bgmTimer=setInterval(bgmTick, 30);
}
function stopAmbient(){
  bgmPlaying=false;
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; }
}
function playToggleSound(){
  ensureAudio(); if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(500,t0); osc.frequency.exponentialRampToValueAtTime(700,t0+0.08);
  gain.gain.setValueAtTime(0.14,t0); gain.gain.exponentialRampToValueAtTime(0.001,t0+0.1);
  osc.connect(gain); gain.connect(sfxGain);
  osc.start(t0); osc.stop(t0+0.12);
}
function playMilestoneJingle(){
  ensureAudio(); if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  [523,659,784].forEach((f,i)=>{
    const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
    osc.type='square'; osc.frequency.setValueAtTime(f,t0+i*0.09);
    gain.gain.setValueAtTime(0.001,t0+i*0.09); gain.gain.linearRampToValueAtTime(0.18,t0+i*0.09+0.02); gain.gain.exponentialRampToValueAtTime(0.001,t0+i*0.09+0.18);
    osc.connect(gain); gain.connect(sfxGain);
    osc.start(t0+i*0.09); osc.stop(t0+i*0.09+0.2);
  });
}
function playMissSound(){
  ensureAudio(); if(!audioCtx) return;
  const bufferSize=Math.floor(audioCtx.sampleRate*0.3);
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=buffer;
  const filter=audioCtx.createBiquadFilter(); filter.type='lowpass';
  const t0=audioCtx.currentTime;
  filter.frequency.setValueAtTime(2000,t0); filter.frequency.exponentialRampToValueAtTime(150,t0+0.3);
  const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.3,t0); gain.gain.exponentialRampToValueAtTime(0.001,t0+0.3);
  src.connect(filter); filter.connect(gain); gain.connect(sfxGain);
  src.start(t0); src.stop(t0+0.32);
}
function playGameOverJingle(){
  ensureAudio(); if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  const notes=[392,349,294,262];
  notes.forEach((f,i)=>{
    const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(f,t0+i*0.18);
    gain.gain.setValueAtTime(0.001,t0+i*0.18); gain.gain.linearRampToValueAtTime(0.2,t0+i*0.18+0.02); gain.gain.exponentialRampToValueAtTime(0.001,t0+i*0.18+0.35);
    osc.connect(gain); gain.connect(sfxGain);
    osc.start(t0+i*0.18); osc.stop(t0+i*0.18+0.4);
  });
}

const btnMute=document.getElementById('btn-mute');
btnMute.addEventListener('click', ()=>{
  ensureAudio();
  muted=!muted;
  if(masterGain) masterGain.gain.value = muted?0:1;
  btnMute.textContent = muted ? '🔇' : '🔊';
});

// ============================================================
// 入力
// ============================================================
function handleConfirmKey(){
  if(state==='TITLE' || state==='GAMEOVER') startGame();
}
window.addEventListener('keydown',(e)=>{
  if(['ArrowLeft','KeyA'].includes(e.code)) toggleFlag('white');
  if(['ArrowRight','KeyD'].includes(e.code)) toggleFlag('red');
  if(['Enter','Space'].includes(e.code)){ handleConfirmKey(); e.preventDefault(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.getElementById('btn-white-flag').addEventListener('pointerdown',(e)=>{ e.preventDefault(); toggleFlag('white'); });
document.getElementById('btn-red-flag').addEventListener('pointerdown',(e)=>{ e.preventDefault(); toggleFlag('red'); });

canvas.addEventListener('click', ()=>{
  if(state==='TITLE' || state==='GAMEOVER'){ startGame(); }
});

// ============================================================
// ループ
// ============================================================
let lastTime=null;
function loop(ts){
  if(lastTime===null) lastTime=ts;
  let deltaMs=ts-lastTime; lastTime=ts;
  if(deltaMs>100) deltaMs=100;
  const dt=deltaMs/16.6667;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
